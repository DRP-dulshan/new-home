# Rebuilds the site every hour so it shows Property Finder's current listings:
# each Vercel build runs scripts/sync-property-finder.mjs first (npm prebuild).
#
# Setup: Vercel → new-home → Settings → Git → Deploy Hooks → create one for
# the main branch, then GitHub → Settings → Secrets and variables → Actions →
# New repository secret VERCEL_DEPLOY_HOOK_URL with the hook's URL.
name: Sync Property Finder listings

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Vercel rebuild
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set yet; nothing to do."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
